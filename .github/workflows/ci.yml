name: ci

# Every published release must still equal the bytes its SRI hashes were made from, and the newest release
# must equal what the current source builds (src/release.test.ts). A failing run means a released file changed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: trigekey-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node comes from the runner image (socionet-ci ships Node 24): actions/setup-node downloaded it again on
      # every run, 12 of the job's 26 seconds. --engine-strict fails the job when that Node is outside "engines"
      # in package.json.
      - run: |
          node --version
          npm ci --ignore-scripts --engine-strict
      # node --run runs the package.json scripts without npm's startup (no pre/post scripts exist).
      - run: node --run check
      - run: node --run test
