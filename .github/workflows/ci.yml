name: ci

# Every published release must still equal the bytes its SRI hashes were made from, and the newest release
# must equal what the current source builds (src/release.test.ts). A failing run means a released file changed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: trigekey-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner image ships Node 24; downloading it again with setup-node took 12 of the job's 26 seconds.
      - name: Node 24
        id: node
        run: |
          case $(node --version 2>/dev/null || true) in
          v24.*) echo "Node $(node --version) is installed" ;;
          *) echo "missing=true" >> "$GITHUB_OUTPUT" ;;
          esac
      - if: steps.node.outputs.missing == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
